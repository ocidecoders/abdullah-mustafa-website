<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diary — Written by Abdullah Al Mustafa</title>
  <meta name="description" content="Personal stories, life experiences, and thoughts written directly by Abdullah Al Mustafa.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#F9F8F6">
  
  <link rel="canonical" href="https://abdullahalmustafa.onrender.com/diary.html">
  
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">

  <style>
    .diary-container { max-width: 900px; margin: 100px auto 60px; padding: 0 20px; }
    .page-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 2px solid var(--text); }
    .page-header h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; margin-bottom: 12px; }
    .subtitle { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
    .subtitle::before { content: ""; display: block; width: 30px; height: 2px; background: var(--accent); }

    .writings-feed { display: flex; flex-direction: column; gap: 40px; }
    .writing-card { display: block; }
    .writing-link { display: block; text-decoration: none; color: inherit; transition: transform 0.3s; }
    .writing-link:hover { transform: translateY(-4px); }
    .writing-image { width: 100%; background: #E8E5DE; border: 1px solid var(--line); overflow: hidden; border-radius: 8px; }
    .writing-image img { width: 100%; height: auto; max-height: 400px; object-fit: cover; display: block; transition: transform 0.6s; }
    .writing-link:hover .writing-image img { transform: scale(1.02); }
    .writing-info { padding-top: 20px; display: flex; flex-direction: column; gap: 8px; }
    .writing-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.2rem, 2.5vw, 1.6rem); color: var(--text); margin: 0; }
    .writing-date { font-family: var(--font-display); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
    .writing-read { font-family: var(--font-display); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-top: 8px; display: inline-block; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">Abdullah Al Mustafa</a>
    <div class="nav-links">
      <a href="index.html#bio">Bio</a>
      <a href="index.html#music">Music</a>
      <a href="diary.html" style="color: var(--accent);">Diary</a>
      <a href="faq.html">FAQ</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav>

  <main class="diary-container">
    <div class="page-header">
      <h1>Diary</h1>
      <div class="subtitle">Some stories from life, written by Abdullah</div>
    </div>
    
    <div class="writings-feed" id="diary-feed"></div>
  </main>

  <!-- Hidden Footer for Crawling -->
  <div style="font-size: 0.65rem; opacity: 0.15; text-align: center; padding: 20px; border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; font-family: sans-serif; color: var(--text); background: var(--bg);">
    <a href="index.html" style="color: inherit; text-decoration: none;">Home</a>
    <a href="about.html" style="color: inherit; text-decoration: none;">About</a>
    <a href="diary.html" style="color: inherit; text-decoration: none;">Diary</a>
    <a href="blog-who-is-mustafa.html" style="color: inherit; text-decoration: none;">Who is Mustafa</a>
    <a href="blog-ali-and-mustafa.html" style="color: inherit; text-decoration: none;">Ali & Me</a>
    <a href="faq.html" style="color: inherit; text-decoration: none;">FAQ</a>
    <a href="https://ocidecoders.onrender.com/" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">Ocide Coders</a>
  </div>

  <script src="data/diary.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const data = window.DIARY_DATA || [];
      const feed = document.getElementById('diary-feed');
      if (!feed || data.length === 0) return;

      data.forEach(entry => {
        const card = document.createElement('article');
        card.className = 'writing-card';
        
        const link = entry.link || '#';
        const imgHtml = entry.image ? `<div class="writing-image"><img src="${entry.image}" alt="${entry.title}" loading="lazy"></div>` : '';
        
        card.innerHTML = `
          <a href="${link}" class="writing-link">
            ${imgHtml}
            <div class="writing-info">
              <h3 class="writing-title">${entry.title}</h3>
              <span class="writing-date">${entry.date}</span>
              <span class="writing-read">Read Story →</span>
            </div>
          </a>
        `;
        feed.appendChild(card);
      });
    });
  </script>

</body>
</html>
